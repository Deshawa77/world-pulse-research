services:

  backend:

    image: ${BACKEND_IMAGE_REPO}:${IMAGE_TAG}

    container_name: world-pulse-backend

    restart: unless-stopped

    env_file:

      - .env

    ports:

      - "8000:8000"

    healthcheck:

      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]

      interval: 30s

      timeout: 5s

      retries: 5

      start_period: 20s

