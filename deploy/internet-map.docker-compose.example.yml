services:
  backend-api:
    image: ${BACKEND_IMAGE_REPO}:${IMAGE_TAG}
    container_name: world-pulse-backend-api
    restart: unless-stopped
    environment:
      WORLD_PULSE_ENVIRONMENT: production
      WORLD_PULSE_ENABLE_DOTENV_FALLBACK: "false"
      WORLD_PULSE_SECRETS_FILE: /run/secrets/world-pulse-runtime.json
      INTERNET_MAP_RUNTIME_ENABLED: "false"
      INTERNET_MAP_RUNTIME_STARTUP_WARM: "false"
    volumes:
      - ./secrets/world-pulse-runtime.json:/run/secrets/world-pulse-runtime.json:ro
    ports:
      - "8000:8000"

  internet-map-runtime:
    image: ${BACKEND_IMAGE_REPO}:${IMAGE_TAG}
    container_name: world-pulse-internet-map-runtime
    restart: unless-stopped
    command: ["python", "scripts/run_internet_map_runtime.py"]
    environment:
      WORLD_PULSE_ENVIRONMENT: production
      WORLD_PULSE_ENABLE_DOTENV_FALLBACK: "false"
      WORLD_PULSE_SECRETS_FILE: /run/secrets/world-pulse-runtime.json
      INTERNET_MAP_RUNTIME_ENABLED: "true"
      INTERNET_MAP_RUNTIME_STARTUP_WARM: "true"
    volumes:
      - ./secrets/world-pulse-runtime.json:/run/secrets/world-pulse-runtime.json:ro
